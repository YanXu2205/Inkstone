name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Signing is optional. See docs/SIGNING.md.
# When the secrets below are absent, installers still build and upload unsigned.

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macos-arm
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Windows certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/cert.pfx", $bytes)
          echo "WINDOWS_CERTIFICATE_PATH=$env:RUNNER_TEMP/cert.pfx" >> $env:GITHUB_ENV

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows Authenticode (optional)
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Apple signing + notarization (optional)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signatures (optional)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inkstone ${{ github.ref_name }}"
          releaseBody: |
            Desktop builds of Inkstone for this tag.

            ## Downloads
            Pick the installer for your OS from the assets below:
            - **Windows** — `.msi` / `.exe`
            - **macOS** — `.dmg` (Apple Silicon and Intel)
            - **Linux** — `.AppImage` / `.deb`

            Installers may be **unsigned** unless repository signing secrets
            are configured (see `docs/SIGNING.md`). Windows SmartScreen /
            macOS Gatekeeper warnings are expected in that case.

            ## Web
            Or run from source:
            ```bash
            git clone https://github.com/YanXu2205/Inkstone.git
            cd Inkstone && npm install && npm run dev
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
