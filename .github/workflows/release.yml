name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Signing is optional — see docs/SIGNING.md.
# Empty secrets must NOT be exported (tauri treats them as "sign with bad cert").

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macos-arm
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Only export signing vars when the secret has a real value.
      - name: Configure optional code signing
        shell: bash
        env:
          S_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_WIN_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          S_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_IDTY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          S_TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S_TAURI_KPW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set_if() { # name value
            if [ -n "$2" ]; then
              echo "$1<<EOF" >> "$GITHUB_ENV"
              echo "$2" >> "$GITHUB_ENV"
              echo "EOF" >> "$GITHUB_ENV"
              echo "signing: set $1"
            else
              echo "signing: skip $1 (empty)"
            fi
          }
          set_if WINDOWS_CERTIFICATE "$S_WIN_CERT"
          set_if WINDOWS_CERTIFICATE_PASSWORD "$S_WIN_PASS"
          set_if APPLE_CERTIFICATE "$S_APPLE_CERT"
          set_if APPLE_CERTIFICATE_PASSWORD "$S_APPLE_PASS"
          set_if APPLE_SIGNING_IDENTITY "$S_APPLE_IDTY"
          set_if APPLE_ID "$S_APPLE_ID"
          set_if APPLE_PASSWORD "$S_APPLE_PW"
          set_if APPLE_TEAM_ID "$S_APPLE_TEAM"
          set_if TAURI_SIGNING_PRIVATE_KEY "$S_TAURI_KEY"
          set_if TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$S_TAURI_KPW"

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inkstone ${{ github.ref_name }}"
          releaseBody: |
            Desktop builds of Inkstone for this tag.

            ## Downloads
            - **Windows** — `.msi` / `.exe`
            - **macOS** — `.dmg` (Apple Silicon and Intel)
            - **Linux** — `.AppImage` / `.deb` / `.rpm`

            Installers are **unsigned** unless you configured secrets
            (see `docs/SIGNING.md`). SmartScreen / Gatekeeper warnings are normal.

            ## Web
            ```bash
            git clone https://github.com/YanXu2205/Inkstone.git
            cd Inkstone && npm install && npm run dev
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
