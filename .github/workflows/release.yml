name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macos-arm
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - name: macos-intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Inkstone ${{ github.ref_name }}"
          releaseBody: |
            Desktop builds of Inkstone for this tag.

            ## Downloads
            Pick the installer for your OS from the assets below:
            - **Windows** — `.msi` / `.exe`
            - **macOS** — `.dmg` (Apple Silicon and Intel)
            - **Linux** — `.AppImage` / `.deb`

            ## Web
            Or run from source:
            ```bash
            git clone https://github.com/YanXu2205/Inkstone.git
            cd Inkstone && npm install && npm run dev
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
