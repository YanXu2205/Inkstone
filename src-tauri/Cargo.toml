[package]
name = "inkstone"
version = "0.3.2"
description = "Free, open-source WYSIWYG Markdown editor"
authors = ["inkstone contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/YanXu2205/Inkstone"
edition = "2021"

# The _lib suffix avoids collision with the binary on Windows.
[lib]
name = "inkstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
